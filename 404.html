<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 // ROUTE NOT FOUND — NIVEX SCRIPTS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #07080c;
      color: #e0f2fe;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Space Mono', monospace;
      text-align: center;
      padding: 24px;
    }
    .box-404 {
      background: rgba(14, 18, 28, 0.7);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 16px;
      padding: 48px 36px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.1);
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 72px;
      color: #00f0ff;
      margin: 0 0 12px 0;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
    }
    p {
      color: #94a3b8;
      margin: 12px 0 28px 0;
      line-height: 1.6;
    }
    .btn-home {
      display: inline-block;
      padding: 12px 28px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid #00f0ff;
      border-radius: 30px;
      color: #00f0ff;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 2px;
      transition: all 0.3s ease;
    }
    .btn-home:hover {
      background: #00f0ff;
      color: #07080c;
      box-shadow: 0 0 20px #00f0ff;
    }
  </style>
</head>
<body>
  <div class="box-404">
    <h1>404</h1>
    <div style="color: #a855f7; font-weight: 700; letter-spacing: 3px; margin-bottom: 8px;">// SECTOR UNREACHABLE</div>
    <p>The requested uplink frequency or route does not exist in the NIVEX network directory.</p>
    <a href="./" class="btn-home">← RETURN TO SYSTEM CORE</a>
  </div>
</body>
</html>
